# ==========================================================
#  Observatorio Inteligente de Aves · configuración
# ==========================================================
#  Se edita con el Bloc de notas. Los cambios se aplican al volver a abrir
#  el Observatorio (cerrarlo y abrirlo de nuevo).
#  Una línea vacía después del "=" deja el valor automático.
#
#  En la versión instalada este archivo es config\observatorio.ini, junto a
#  Observatorio.exe. En el código fuente se copia esta plantilla con ese nombre
#  si se quiere usar (si no existe, se usan los valores de config/settings.py).
# ==========================================================

[camara]
# rtsp     = cámara IP del humedal (la dirección va en config\camara_local.json)
# camara   = cámara USB o integrada del PC
# video    = video de demostración en bucle
# pantalla = analiza lo que se ve en un monitor (pruebas sin cámara)
# ventana  = analiza solo la ventana de una aplicación (navegador, VLC…)
fuente = rtsp
# Cámara USB: 0 = la primera, 1 = la segunda...
indice_camara = 0
# Con fuente = pantalla: número del monitor que se analiza
monitor_captura = 1
# Con fuente = ventana: programa (p. ej. chrome.exe) y, opcional, un texto del título
ventana_programa =
ventana_titulo =
# Códec de la cámara IP: h264 o h265 (se ve en la página web de la cámara)
codec_rtsp = h264

[pantallas]
# Número de monitor de Windows (Configuración > Pantalla > Identificar,
# o el acceso directo "Ver monitores"). Vacío = automático: el kiosco en el
# monitor principal y la pantalla táctil en el otro.
monitor_kiosco =
monitor_tactil =
# si = el kiosco ocupa todo su monitor (F11 alterna, Esc sale)
pantalla_completa = si
# auto = abre la pantalla táctil (catálogo y trivia); no = no la abre
pantalla_2 = auto
# Cuadros por segundo del video en el kiosco
fps_video = 30

[portal]
# si = el portal de administración se abre desde OTROS computadores de la red
#      (http://NOMBRE-DE-ESTE-PC:5000). Requiere permitirlo en el firewall
#      (lo ofrece el instalador).
# no = solo desde este PC (http://127.0.0.1:5000)
en_red = si
puerto = 5000
# si = al abrir el kiosco también se abre el portal en segundo plano
abrir_con_kiosco = si

[ia]
# Confianza mínima para dar por identificada una especie (0.50 a 0.95)
umbral_confianza = 0.70
# si = guarda las aves que no reconoce para identificarlas en el portal ("Por identificar")
guardar_aves_desconocidas = si
