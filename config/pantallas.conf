# ==========================================================
# Pantallas del Observatorio en Linux / Jetson Orin Nano
# ==========================================================
# Lo leen main_kiosco.py y scripts/jetson/configurar_pantallas.sh.
# Formato: CLAVE="valor" (sintaxis de shell; sin espacios alrededor del =).
#
# El Jetson Orin Nano tiene UNA salida DisplayPort. Con un hub DisplayPort MST
# esa salida se divide en dos monitores, que Linux ve como dos salidas
# (normalmente DP-1-1 y DP-1-2, pero DEPENDE del hub: verlas con
#   scripts/jetson/configurar_pantallas.sh --listar   o   xrandr --listmonitors).
#
# Vacío = automático: el kiosco en el monitor principal y la Pantalla 2 en el otro.

# Salida de video del kiosco (Pantalla 1: video en vivo) y de la Pantalla 2
# (catálogo y trivia, táctil). Ejemplo: SALIDA_KIOSCO="DP-1-1"
SALIDA_KIOSCO=""
SALIDA_TACTIL=""

# Resolución de cada salida ("auto" = la preferida del monitor; o p. ej. "1920x1080").
RESOLUCION_KIOSCO="auto"
RESOLUCION_TACTIL="auto"

# Nombre del panel táctil de cada monitor, tal como lo muestra
#   xinput list --name-only
# Así cada toque cae en su pantalla y no en el escritorio completo.
# Vacío = no se asigna (si el kiosco no es táctil, dejar TACTIL_KIOSCO vacío).
TACTIL_KIOSCO=""
TACTIL_PANTALLA2=""

# Evita que la pantalla se apague o muestre el protector (kiosco 24/7).
DESACTIVAR_AHORRO_ENERGIA="si"
